# Validates both shared presets on every change and gates main on the result.
# Both default.json and standards.json are load-bearing for the whole
# managed-deps fleet: a JSON typo, an invalid Renovate option or a colliding
# packageRule silently breaks every drift PR across every consumer repo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-presets:
    name: validate-presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # This repo carries no package.json#packageManager, so pin pnpm here.
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0

      - name: JSON syntax check
        run: |
          for file in *.json; do
            echo "jq: $file"
            jq . "$file" > /dev/null
          done

      - name: Renovate config validation
        run: pnpm dlx --package renovate -- renovate-config-validator default.json standards.json

      - name: Vitest regular grouping and local test-only worker contracts (full security not proven)
        run: |
          tooling_dir="$(mktemp -d "$RUNNER_TEMP/vitest-lockstep-tools.XXXXXX")"
          pnpm --dir "$tooling_dir" add --save-exact renovate@44.127.1 pnpm@11.20.0 --ignore-scripts --config.minimum-release-age=0
          node "$tooling_dir/node_modules/renovate/dist/config-validator.js" --strict default.json standards.json
          node scripts/test-vitest-lockstep.mjs \
            --renovate-root "$tooling_dir/node_modules/renovate" \
            --pnpm-cli "$tooling_dir/node_modules/pnpm/bin/pnpm.mjs"
          node scripts/test-vitest-worker-contract.mjs \
            --renovate-root "$tooling_dir/node_modules/renovate" \
            --pnpm-cli "$tooling_dir/node_modules/pnpm/bin/pnpm.mjs"

  vitest-peer-alignment-local:
    name: vitest-peer-alignment-local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Independent read-only checker contracts (consumer enforcement pending)
        run: |
          install_root="$(mktemp -d "$RUNNER_TEMP/vitest-alignment-install.XXXXXX")"
          mkdir -p "$install_root/home" "$install_root/config" "$install_root/cache"
          env -i HOME="$install_root/home" XDG_CONFIG_HOME="$install_root/config" \
            XDG_CACHE_HOME="$install_root/cache" PATH="$PATH" CI=true \
            npm_config_userconfig=/dev/null npm_config_globalconfig=/dev/null \
            pnpm --dir scripts/vitest-peer-alignment install --frozen-lockfile \
              --ignore-scripts --ignore-pnpmfile --pm-on-fail=ignore \
              --registry=https://registry.npmjs.org --store-dir="$install_root/store"
          node scripts/test-vitest-peer-alignment.mjs

  vitest-helper-local:
    name: vitest-helper-local (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: candidate43-consumer11
            node: 24.18.0
            pnpm: 11.17.0
            renovate: 43.288.0
          - profile: reference44
            node: 24.21.0
            pnpm: 11.20.0
            renovate: 44.127.1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ matrix.pnpm }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Exact local compatibility and same-advisory helper contracts (activation pending)
        env:
          PROFILE: ${{ matrix.profile }}
          PNPM_VERSION: ${{ matrix.pnpm }}
          RENOVATE_VERSION: ${{ matrix.renovate }}
        run: |
          tooling_dir="$(mktemp -d "$RUNNER_TEMP/vitest-helper-tools.XXXXXX")"
          pnpm --dir "$tooling_dir" add --save-exact "renovate@$RENOVATE_VERSION" "pnpm@$PNPM_VERSION" --ignore-scripts --config.minimum-release-age=0
          node "$tooling_dir/node_modules/renovate/dist/config-validator.js" --strict default.json standards.json
          node scripts/test-vitest-worker-contract.mjs --runtime-profile "$PROFILE" \
            --renovate-root "$tooling_dir/node_modules/renovate" \
            --pnpm-cli "$tooling_dir/node_modules/pnpm/bin/pnpm.mjs"
          node "$tooling_dir/node_modules/pnpm/bin/pnpm.mjs" --dir scripts/vitest-lockstep install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --pm-on-fail=ignore
          node scripts/test-vitest-helper.mjs --runtime-profile "$PROFILE" \
            --renovate-root "$tooling_dir/node_modules/renovate" \
            --pnpm-cli "$tooling_dir/node_modules/pnpm/bin/pnpm.mjs"

  vitest-native-observation-local:
    name: vitest-native-observation-local (source only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Authentic candidate and differing Linux interpreter preparation
        run: |
          tooling_dir="$(mktemp -d "$RUNNER_TEMP/vitest-native-tools.XXXXXX")"
          pnpm --dir "$tooling_dir" add --save-exact renovate@43.288.0 --ignore-scripts --ignore-pnpmfile --config.minimum-release-age=0
          curl --fail --silent --show-error --location https://registry.npmjs.org/pnpm/-/pnpm-11.17.0.tgz -o "$tooling_dir/pnpm.tgz"
          echo "644eb5079654e87dae59a07e62d7f098162b9ce58f06077328b5ddefca1c8541  $tooling_dir/pnpm.tgz" | sha256sum --check
          mkdir "$tooling_dir/stock"
          tar --extract --gzip --file "$tooling_dir/pnpm.tgz" --directory "$tooling_dir/stock" --no-same-owner
          curl --fail --silent --show-error https://nodejs.org/dist/v24.21.0/SHASUMS256.txt -o "$tooling_dir/SHASUMS256.txt"
          curl --fail --silent --show-error https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.gz -o "$tooling_dir/node-v24.21.0-linux-x64.tar.gz"
          (cd "$tooling_dir" && awk '$2 == "node-v24.21.0-linux-x64.tar.gz" {print}' SHASUMS256.txt | sha256sum --check --strict)
          tar --extract --gzip --file "$tooling_dir/node-v24.21.0-linux-x64.tar.gz" --directory "$tooling_dir" --no-same-owner
          # Complete original stock distributions for test-only source fixtures.
          # Fixed test-fixture pins, not production release-owner authority; no archive execution.
          mkdir "$tooling_dir/q1-archives"
          cp "$tooling_dir/pnpm.tgz" "$tooling_dir/q1-archives/pnpm-11.17.0.tgz"
          curl --fail --silent --show-error --location https://registry.npmjs.org/yaml/-/yaml-2.9.1.tgz -o "$tooling_dir/q1-archives/yaml-2.9.1.tgz"
          curl --fail --silent --show-error --location https://registry.npmjs.org/semver/-/semver-7.8.5.tgz -o "$tooling_dir/q1-archives/semver-7.8.5.tgz"
          curl --fail --silent --show-error https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.gz -o "$tooling_dir/q1-archives/node-v24.18.0-linux-x64.tar.gz"
          echo "4ef6c54cf559b8a207b7b518378230805a1c84af239b14960e8c67c7d59de5d3  $tooling_dir/q1-archives/yaml-2.9.1.tgz" | sha256sum --check
          echo "d85045d4300d7d57c891336b95df532e73f34c22ffcd222452b6d08b9d127d5d  $tooling_dir/q1-archives/semver-7.8.5.tgz" | sha256sum --check
          echo "783130984963db7ba9cbd01089eaf2c2efb055c7c1693c943174b967b3050cb8  $tooling_dir/q1-archives/node-v24.18.0-linux-x64.tar.gz" | sha256sum --check
          echo "NATIVE_TOOLING=$tooling_dir" >> "$GITHUB_ENV"
      - name: Native dispatch, differing actual Node, delegation and whole-lifecycle negatives
        run: |
          node scripts/test-vitest-release-trust.mjs
          node scripts/test-vitest-native-worker-source.mjs
          node scripts/test-vitest-native-prepare.mjs --pnpm-archive "$NATIVE_TOOLING/pnpm.tgz" --pnpm-root "$NATIVE_TOOLING/stock/package"
          node scripts/test-vitest-release-production.mjs --archives "$NATIVE_TOOLING/q1-archives" --platform linux-x64 --require-linux
          node scripts/test-vitest-native-authority.mjs --archives "$NATIVE_TOOLING/q1-archives" --platform linux-x64 --require-linux
          node scripts/test-vitest-native-collector.mjs
          node scripts/test-vitest-native-runtime.mjs "$NATIVE_TOOLING/node_modules/renovate/dist/workers/repository/update/branch/index.js"
          node scripts/test-vitest-native-identity.mjs --child-node "$NATIVE_TOOLING/node-v24.21.0-linux-x64/bin/node"
          node scripts/test-vitest-native-data-only.mjs \
            --pnpm-archive "$NATIVE_TOOLING/pnpm.tgz" \
            --pnpm-root "$NATIVE_TOOLING/stock/package" \
            --renovate-root "$NATIVE_TOOLING/node_modules/renovate"
          node scripts/test-vitest-native.mjs \
            --pnpm-archive "$NATIVE_TOOLING/pnpm.tgz" \
            --pnpm-root "$NATIVE_TOOLING/stock/package" \
            --renovate-root "$NATIVE_TOOLING/node_modules/renovate" \
            --child-node "$NATIVE_TOOLING/node-v24.21.0-linux-x64/bin/node"
