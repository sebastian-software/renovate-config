# Validates both shared presets on every change and gates main on the result.
# Both default.json and standards.json are load-bearing for the whole
# managed-deps fleet: a JSON typo, an invalid Renovate option or a colliding
# packageRule silently breaks every drift PR across every consumer repo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-presets:
    name: validate-presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # This repo carries no package.json#packageManager, so pin pnpm here.
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0

      - name: JSON syntax check
        run: |
          for file in *.json; do
            echo "jq: $file"
            jq . "$file" > /dev/null
          done

      - name: Renovate config validation
        run: pnpm dlx --package renovate -- renovate-config-validator default.json standards.json

      - name: Vitest regular grouping (security acceptance not run)
        run: |
          tooling_dir="$(mktemp -d "$RUNNER_TEMP/vitest-lockstep-tools.XXXXXX")"
          pnpm --dir "$tooling_dir" add --save-exact renovate@44.127.1 pnpm@11.20.0 --ignore-scripts --config.minimum-release-age=0
          node "$tooling_dir/node_modules/renovate/dist/config-validator.js" --strict default.json standards.json
          node scripts/test-vitest-lockstep.mjs \
            --renovate-root "$tooling_dir/node_modules/renovate" \
            --pnpm-cli "$tooling_dir/node_modules/pnpm/bin/pnpm.cjs"
